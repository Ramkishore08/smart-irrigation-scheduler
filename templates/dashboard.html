<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irrigation Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand fw-bold">🌱 Smart Irrigation Scheduler</span>
        <a href="/" class="btn btn-outline-light">Home</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-success text-white text-center">
            <h2>🌾 Irrigation Dashboard</h2>
        </div>

        <div class="card-body">

            <form action="/result" method="POST">

                <div class="mb-3">
                    <label class="form-label">Field Name</label>
                    <input type="text" class="form-control" name="field" placeholder="Enter Field Name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Crop Stage</label>
                    <select class="form-select" name="stage">
                        <option>Seedling</option>
                        <option>Vegetative</option>
                        <option>Flowering</option>
                        <option>Harvest</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Soil Moisture (%)</label>
                    <input type="number" class="form-control" name="moisture" min="0" max="100" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Weather Forecast</label>
                    <select class="form-select" name="weather">
                        <option>Sunny</option>
                        <option>Cloudy</option>
                        <option>Rain</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Water Available (Litres)</label>
                    <input type="number" class="form-control" name="water" min="0" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Field Priority</label>
                    <select class="form-select" name="priority">
                        <option>High</option>
                        <option>Medium</option>
                        <option>Low</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button class="btn btn-success btn-lg" type="submit">
                        Generate Irrigation Schedule
                    </button>
                </div>

            </form>
            <div class="text-center mt-4">

                <a href="/" class="btn btn-success me-2">
                    🏠 Home
                </a>

                <a href="/report" class="btn btn-primary me-2">
                    📊 View Report
                </a>

                <a href="/override" class="btn btn-warning">
                    🔐 Admin Override
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
